application:
  subdomain: pushgo
  multi_instance: false
  upstreams:
    - location: /
      backend: http://pushgo:6666
  public_path:
    - /

services:
  pushgo:
    # 镜像模式：Action 只读校验后改写成加速地址（ghcr.1ms.run）
    image: ghcr.1ms.run/aldenclark/pushgo-gateway:v1.3.2
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:6666/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "6666:6666"
    command:
      - --http-addr
      - 0.0.0.0:6666
      - --private-transports
      - none
      - --token-service-url
      - https://token.pushgo.cn
      - --public-base-url
      - https://{{ .S.AppDomain }}
    environment:
      - PUSHGO_TOKEN={{ .U.pushgo_token }}
    volumes:
      - pushgo-data:/data

volumes:
  pushgo-data:
    type: persist

deployment:
  replicas: 1
