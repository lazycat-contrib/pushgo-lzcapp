application:
  subdomain: pushgo
  multi_instance: false
  upstreams:
    - location: /
      backend: http://pushgo:6666
  public_path:
    - /
services:
  pushgo:
    # upstream: aldenclark/pushgo-gateway:v1.3.2
    image: docker.1ms.run/aldenclark/pushgo-gateway:v1.3.2
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:6666/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command:
      - --http-addr
      - 0.0.0.0:6666
      - --private-transports
      - none
      - --token-service-url
      - https://token.pushgo.cn
      - --public-base-url
      - https://{{ .S.AppDomain }}
    environment:
      - PUSHGO_TOKEN={{ .U.pushgo_token }}
    binds:
      - /lzcapp/var/pushgo:/data
usage: |
  PushGo Gateway 是跨平台消息推送服务，支持 iOS / watchOS / macOS / Android 客户端。
  默认关闭私有传输，仅开启公共 API。私输输可在设置中开启。
