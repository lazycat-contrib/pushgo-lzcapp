icon: ./icon.png

name: PushGo
summary: 跨平台消息推送网关
description: |
  PushGo Gateway 是 PushGo 推送服务的服务端，支持 iOS / watchOS / macOS / Android 客户端。
  提供公共 HTTP API（设备、频道、消息、事件）和私有传输（QUIC / TCP / WSS / MQTT 5）。

  懒猫部署默认关闭私有传输（需要额外部署），仅开启公共 API。私有传输可在设置中开启。

  镜像跟随上游 ghcr.io/aldenclark/pushgo-gateway 的版本 tag 自动更新（镜像模式）。

version: 1.3.2
release_notes: "PushGo Gateway v1.3.2：QUIC/TCP/WSS/MQTT 5 私有传输，默认关闭以避免端口冲突"

tags:
  - 消息推送
  - MCP
