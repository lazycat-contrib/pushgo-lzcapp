params:
  - id: pushgo_token
    type: string
    name: "API 访问密钥"
    description: "留空则公共 API 无需密钥访问；填入则所有请求需携带 PUSHGO_TOKEN header。推荐生产环境设置随机字符串。"
    default_value: ""
    optional: true

